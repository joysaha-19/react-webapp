<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="public-controls" style="text-align:center;padding:20px;background:#f4f4f4;">
      <div class="env-display" style="margin-bottom:8px;font-weight:600;">Environment: <span id="env-value">%REACT_APP_ENVIRONMENT%</span></div>
      <nav style="display:flex;gap:16px;justify-content:center;margin-bottom:20px;">
        <button id="get-photos" type="button">Get Photos</button>
        <button id="get-metadata" type="button">Get Metadata</button>
      </nav>
      <div id="response-container" style="margin-top:20px;padding:15px;background:white;border-radius:5px;min-height:50px;max-height:400px;overflow-y:auto;border:1px solid #ddd;display:none;">
        <h3 style="margin-top:0;">Response:</h3>
        <pre id="response-content" style="background:#f9f9f9;padding:10px;border-radius:3px;white-space:pre-wrap;word-wrap:break-word;"></pre>
      </div>
    </div>

    <div id="root"></div>

    <script>
      (function(){
        var env = "%REACT_APP_ENVIRONMENT%";
        var gw = "%REACT_APP_GATEWAY_IP%";
        
        function getPhotos(e){
          e.preventDefault();
          alert('Getting photos from ' + gw + ' in ' + env + ' environment');
        }
        
        function getMetadata(e){
          e.preventDefault();
          var url = 'http://' + gw + '/';
          var container = document.getElementById('response-container');
          var content = document.getElementById('response-content');
          
          content.textContent = 'Loading...';
          container.style.display = 'block';
          
          fetch(url)
            .then(function(response){ return response.text(); })
            .then(function(data){
              content.textContent = data;
            })
            .catch(function(err){
              content.textContent = 'Error: ' + err.message + '\n\nFailed to fetch from ' + url;
            });
        }
        
        document.addEventListener('DOMContentLoaded', function(){
          var p = document.getElementById('get-photos');
          var m = document.getElementById('get-metadata');
          if(p) p.addEventListener('click', getPhotos);
          if(m) m.addEventListener('click', getMetadata);
        });
      })();
    </script>

    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
